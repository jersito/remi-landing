<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Pippy, the free baby tracker</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://meetpippy.com/" />
  <meta name="apple-itunes-app" content="app-id=6761399646" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <script>
    (function () {
      var from = (new URLSearchParams(location.search).get('from') || 'site').replace(/[^a-z0-9-]/gi, '').slice(0, 60) || 'site';
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var apple = 'https://apps.apple.com/us/app/ai-baby-tracker-pippy/id6761399646';
      var play = 'https://play.google.com/store/apps/details?id=com.remibabyapp.remi&referrer=' + encodeURIComponent('utm_source=meetpippy&utm_medium=web&utm_campaign=' + from);
      window.PIPPY_LINKS = { apple: apple, play: play };
      if (ios) location.replace(apple);
      else if (/Android/.test(ua)) location.replace(play);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F1E8; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; color: #2C2C34; text-align: center; }
    main { padding: 32px 20px; max-width: 460px; }
    img.icon { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.6rem; margin: 18px 0 8px; }
    p { color: rgba(44,44,52,0.62); line-height: 1.5; margin: 0 0 24px; }
    .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .stores img { height: 52px; }
    a.home { display: inline-block; margin-top: 28px; color: #5f8499; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/pippy-icon.png" alt="Pippy app icon" />
    <h1>Get Pippy free</h1>
    <p>Log feeds, sleep, diapers and pumping by just saying what happened. Free on iPhone and Android.</p>
    <div class="stores">
      <a id="apple" href="https://apps.apple.com/us/app/ai-baby-tracker-pippy/id6761399646"><img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download Pippy on the App Store" /></a>
      <a id="play" href="https://play.google.com/store/apps/details?id=com.remibabyapp.remi"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get Pippy on Google Play" /></a>
    </div>
    <a class="home" href="/">More about Pippy →</a>
  </main>
  <script>document.getElementById('play').href = window.PIPPY_LINKS.play;</script>
  <script src="/analytics-consent.js" defer></script>
</body>
</html>
